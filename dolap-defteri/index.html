// Birimi temel birime çevirir: kg→g, l→ml, tane→adet.
function norm(qty, unit) {
  let q = Number(String(qty).replace(",", ".")) || 0;
  const u = lower(unit).replace(/\.$/, "");
  if (["kg", "kilo", "kilogram"].includes(u)) return { qty: q * 1000, unit: "g" };
  if (["g", "gr", "gram"].includes(u)) return { qty: q, unit: "g" };
  if (["l", "lt", "litre", "liter"].includes(u)) return { qty: q * 1000, unit: "ml" };
  if (["ml", "mililitre"].includes(u)) return { qty: q, unit: "ml" };
  if (["adet", "tane", "ad", "x"].includes(u)) return { qty: q, unit: "adet" };
  if (UNITS.includes(u)) return { qty: q, unit: u };
  return { qty: q, unit: "adet" };
}
function roundQty(q, unit) {
  if (unit === "g" || unit === "ml") return Math.round(q);
  return Math.round(q * 10) / 10;
}
const nf = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 2 });
function fmtQty(q, unit) {
  if (unit === "g" && q >= 1000) return nf.format(Math.round(q / 10) / 100) + " kg";
  if (unit === "ml" && q >= 1000) return nf.format(Math.round(q / 10) / 100) + " L";
  return nf.format(roundQty(q, unit)) + " " + unit;
}

// raw.price: o satır için ödenen toplam tutar (TL). Malzemede birim fiyat (TL / g, ml ya da adet) olarak saklanır.
function addItems(list) {
  let added = 0, increased = 0;
  for (const raw of list) {
    const n = norm(raw.qty, raw.unit);
    if (!raw.name || !(n.qty > 0)) continue;
    const price = toNum(raw.price);
    const up = price > 0 ? price / n.qty : null;
    const ex = state.items.find(i => lower(i.name) === lower(raw.name) && i.unit === n.unit);
    if (ex) {
      const p = mergePrice(ex.qty, ex.unitPrice, n.qty, up);
      ex.qty = roundQty(ex.qty + n.qty, n.unit);
      if (p > 0) ex.unitPrice = p;
      increased++;
    } else {
      const it = { id: uid(), name: String(raw.name).trim(), qty: roundQty(n.qty, n.unit), unit: n.unit, category: categoryFor(raw.name, raw.category) };
      if (up > 0) it.unitPrice = up;
      state.items.push(it);
      added++;
    }
  }
  return { added, increased };
}
const toNum = v => Number(String(v == null ? "" : v).replace(/[^\d,.-]/g, "").replace(",", ".")) || 0;
// Eski ve yeni partinin miktara göre ağırlıklı ortalama birim fiyatı.
function mergePrice(oldQty, oldUp, addQty, addUp) {
  if (!(addUp > 0)) return oldUp;
  if (!(oldUp > 0)) return addUp;
  return (oldQty * oldUp + addQty * addUp) / (oldQty + addQty);
}
const money = new Intl.NumberFormat("tr-TR", { style: "currency", currency: "TRY", maximumFractionDigits: 2 });
const fmtTL = v => money.format(Math.round(v * 100) / 100);
function perLabel(it) {
  if (!(it.unitPrice > 0)) return "";
  if (it.unit === "g") return fmtTL(it.unitPrice * 1000) + "/kg";
  if (it.unit === "ml") return fmtTL(it.unitPrice * 1000) + "/L";
  return fmtTL(it.unitPrice) + "/" + it.unit;
}
// Kullanılacak malzemelerin dolaptaki fiyatlarına göre maliyet; fiyatı bilinmeyenler ayrıca sayılır.
function costOfLines(lines) {
  let total = 0, unknown = 0;
  for (const { item, qty } of lines) {
    if (!item || !(qty > 0)) continue;
    if (item.unitPrice > 0) total += qty * item.unitPrice; else unknown++;
  }
  return { total, unknown };
}
function costText(c, people) {
  if (!c.total && c.unknown) return "Maliyet: fiyat bilgisi yok";
  if (!c.total) return "";
  return `Maliyet ≈ ${fmtTL(c.total)}` + (people > 1 ? ` · kişi başı ${fmtTL(c.total / people)}` : "") +
    (c.unknown ? ` (+${c.unknown} malzemenin fiyatı yok)` : "");
}
const DIETS = {
  "Dengeli": "Dengeli, çeşitli ev yemekleri; özel kısıt yok.",
  "Yüksek protein": "Her öğünde kişi başı en az 30 g protein hedefle; yumurta, et, tavuk, balık, baklagil, yoğurt, peynir gibi protein kaynaklarını öne çıkar, karbonhidratı ölçülü tut.",
  "Düşük karbonhidrat": "Kişi başı öğünde 25-30 g'ı geçmeyen karbonhidrat; makarna, pirinç, ekmek, patates, şeker kullanma ya da çok az kullan; sebze, protein ve sağlıklı yağ ağırlıklı.",
  "Vejetaryen": "Et, tavuk, balık ve deniz ürünü yok; yumurta ve süt ürünleri serbest.",
  "Vegan": "Hiçbir hayvansal ürün yok (et, balık, yumurta, süt, peynir, tereyağı, bal dahil).",
  "Akdeniz": "Zeytinyağı, sebze, baklagil, tam tahıl ve balık ağırlıklı; kırmızı et az.",
  "Kalori kontrollü": "Kişi başı öğün en fazla ~500 kcal; doyurucu ama hafif, kızartma ve ağır sos yok.",
};
// Claude bazen listede olmayan kategori adı verir (ör. "Et", "Sos & Yağ"); en yakın kategoriye eşle.
// Katalogdaki ürünün kategorisi; yoksa eski ad tablosu, en son en yakın kategori.
function categoryFor(name, cat) {
  const p = PRODUCT_BY_NAME.get(lower(name));
  if (p) return p.cat;
  return OLD_CATS[cat] || matchCat(cat);
}
function matchCat(c) {
  if (CATS.includes(c)) return c;
  const words = lower(c).split(/[\s,&/]+/).filter(w => w.length > 1);
  return CATS.find(k => words.some(w => lower(k).split(/[\s,&/]+/).includes(w))) || "Diğer";
}

/* ---------- "Bunu yapıyorum" ---------- */
let cook = null;
function findItem(u) {
  return state.items.find(i => i.id === u.itemId) || state.items.find(i => lower(i.name) === lower(u.name));
}
function usedFor(u, item, people, servings) {
  const n = norm(u.qty, u.unit || item.unit);
  let q = n.qty * people / (servings || people);
  if (n.unit !== item.unit) {
    // farklı birimler (ör. adet / g) güvenle çevrilemez; tarifteki sayıyı aynen öner
    q = Number(u.qty) * people / (servings || people);
  }
  return Math.min(roundQty(q, item.unit), item.qty);
}
function openCook({ title, servings, uses, people, source }) {
  cook = { title, servings, uses, people, source, rows: [] };
  rebuildCookRows();
  renderModal();
}
function rebuildCookRows() {
  const prev = new Map(cook.rows.filter(r => r.edited).map(r => [r.itemId, r]));
  cook.rows = [];
  for (const u of cook.uses) {
    const it = findItem(u);
    if (!it || cook.rows.some(r => r.itemId === it.id)) continue;
    const p = prev.get(it.id);
    cook.rows.push(p || { itemId: it.id, use: usedFor(u, it, cook.people, cook.servings), edited: false });
  }
}
function applyCook() {
  const used = [], finished = [];
  for (const r of cook.rows) {
    const it = state.items.find(i => i.id === r.itemId);
    const q = Math.max(0, Number(String(r.use).replace(",", ".")) || 0);
    if (!it || !q) continue;
    const before = it.qty;
    const take = Math.min(q, it.qty);
    it.qty = roundQty(it.qty - take, it.unit);
    used.push({ itemId: it.id, name: it.name, unit: it.unit, category: it.category, qty: take, before, unitPrice: it.unitPrice || null });
    if (nearlyZero(it.qty, it.unit)) finished.push(it.name);
  }
  state.items = state.items.filter(i => !nearlyZero(i.qty, i.unit));
  if (cook.source && state.plan) {
    const s = cook.source, slot = state.plan.days[s.d] && state.plan.days[s.d].meals[s.m];
    if (slot) slot.done = { option: s.o, people: cook.people };
  }
  const cost = costOfLines(used.map(u => ({ item: { unitPrice: u.unitPrice }, qty: u.qty })));
  state.history.unshift({ id: uid(), title: cook.title, people: cook.people, at: Date.now(), used, source: cook.source, cost: cost.total || null });
  state.history = state.history.slice(0, 60);
  cook = null; renderModal();
  commit(true);
  toast(finished.length ? `Dolap güncellendi. Biten: ${finished.join(", ")}.` : "Dolap güncellendi. Afiyet olsun!");
}
function undoHistory(id) {
  const ix = state.history.findIndex(x => x.id === id);
  if (ix < 0) return;
  const e = state.history[ix];
  for (const u of e.used) {
    const it = state.items.find(i => i.id === u.itemId);
    if (it) it.qty = roundQty(it.qty + u.qty, it.unit);
    else {
      const restored = { id: u.itemId, name: u.name, unit: u.unit, category: u.category || "Diğer", qty: u.before };
      if (u.unitPrice > 0) restored.unitPrice = u.unitPrice;
      state.items.push(restored);
    }
  }
  if (e.source && state.plan) {
    const slot = state.plan.days[e.source.d] && state.plan.days[e.source.d].meals[e.source.m];
    if (slot) slot.done = null;
  }
  state.history.splice(ix, 1);
  commit(true);
  toast(`"${e.title}" geri alındı, malzemeler dolaba döndü.`);
}

function renderModal() {
  const root = document.getElementById("modal");

        h("input", { type: "radio", name: "diet", id: "diet-" + k, checked: st.diet === k, onchange: () => { st.diet = k; save(); render(); } }), k))),
      h("input", { id: "diet-note", placeholder: "Ek tercih (isteğe bağlı): ör. glutensiz, acı sevmem, laktoz yok", value: st.dietNote,
        "aria-label": "Ek beslenme tercihi", oninput: e => { st.dietNote = e.target.value; save(); } })),
    h("div", { class: "small muted" }, `${st.days} gün × ${st.meals.length} öğün × ${st.options} seçenek, ${st.people} kişilik, ${lower(st.diet)}`),
    errFor("plan"),
    busyBtn("plan", state.plan ? "Yeni menü öner" : "Menü öner", "Menü hazırlanıyor…", makePlan, { disabled: !sample })));

  const p = state.plan;
  if (p) {
    if (p.invRev !== state.invRev) out.push(h("div", { class: "notice info" }, "Dolap bu menüden sonra değişti. Güncel malzemelere göre yeni menü önerebilirsin."));
    if (p.diet) out.push(h("div", { class: "small muted" }, `Bu menü: ${p.people} kişilik, ${lower(p.diet)}` + (p.dietNote ? ` (${p.dietNote})` : "") + ". Besin değerleri kişi başı ve yaklaşıktır."));
    p.days.forEach((day, d) => {
      out.push(h("section", { class: "day" },
        h("h2", null, day.label),
        day.meals.map((slot, m) => h("div", { class: "slot" },
          h("div", { class: "row between" }, h("span", { class: "label" }, slot.meal),
            slot.done ? h("span", { class: "chip done" }, `Yapıldı · ${slot.done.people} kişi`) : null),
          h("div", { class: "opts" }, slot.options.map((o, oi) => optionCard(o, d, m, oi, slot)))))));
    });
  }

  out.push(h("div", { class: "card" },
    h("h3", null, "Menü dışında bir şey mi yaptın?"),
    h("p", { class: "small muted" }, "Ne yaptığını yaz, dolaptan düşmem gerekenleri hesaplayayım."),
    h("input", { id: "adhoc", placeholder: "Ör. 2 kişilik menemen yaptım", value: ui.adhoc, oninput: e => { ui.adhoc = e.target.value; } }),
    errFor("adhoc"),
    busyBtn("adhoc", "Hesapla", "Hesaplıyorum…", adhocCook, { disabled: !sample || !state.items.length })));
  return out;
}
function optionCard(o, d, m, oi, slot) {
  const key = `${d}-${m}-${oi}`;
  const cooked = slot.done && slot.done.option === oi;
  const missingNow = o.uses.filter(u => !findItem(u));
  const usesEl = h("div", { class: "uses" }, "Dolaptan: ",
    o.uses.length ? o.uses.map((u, i) => {
      const it = findItem(u), n = norm(u.qty, u.unit || (it && it.unit));
      return [i ? ", " : "", h("b", null, u.name || (it && it.name)), " " + fmtQty(n.qty, n.unit)];
    }) : "—");
  const open = ui.openSteps[key];
  return h("article", { class: "opt" + (cooked ? " cooked" : slot.done ? " faded" : "") },
    h("div", { class: "row between" }, h("h3", null, o.title), o.minutes ? h("span", { class: "small muted mono" }, o.minutes + " dk") : null),
    o.summary ? h("div", { class: "small" }, o.summary) : null,
    o.nutrition && o.nutrition.kcal ? h("div", { class: "chips" },
      h("span", { class: "chip n-kcal" }, `${o.nutrition.kcal} kcal`),
      h("span", { class: "chip n-pro" }, `Protein ${o.nutrition.protein} g`),
      h("span", { class: "chip n-carb" }, `Karb. ${o.nutrition.carbs} g`),
      h("span", { class: "chip n-fat" }, `Yağ ${o.nutrition.fat} g`)) : null,
    usesEl,
    (() => {
      const people = state.plan.people || state.settings.people;
      const t = costText(costOfLines(o.uses.map(u => { const it = findItem(u); return { item: it, qty: it ? usedFor(u, it, people, o.servings) : 0 }; })), people);
      return t ? h("div", { class: "uses" }, t) : null;
    })(),
    (o.extra.length || missingNow.length) ? h("div", { class: "chips" },
      o.extra.map(x => h("span", { class: "chip warn" }, "Eksik: " + x.name)),
      missingNow.map(u => h("span", { class: "chip warn" }, "Bitti: " + u.name))) : null,
    open ? (ui.busy === "steps:" + key ? h("div", { class: "small muted" }, h("span", { class: "spin" }), " Tarif yazılıyor…")
      : o.steps ? h("div", { class: "stack" }, h("ol", { class: "steps" }, o.steps.map(s => h("li", null, s))), o.tip ? h("div", { class: "small muted" }, "İpucu: " + o.tip) : null)
      : errFor("steps:" + key)) : null,
    h("div", { class: "row" },
      h("button", { type: "button", disabled: !sample || (!!ui.busy && ui.busy !== "steps:" + key), onclick: () => loadSteps(d, m, oi) }, open ? "Tarifi gizle" : "Tarif"),
      cooked ? null : h("button", { class: "primary", type: "button", onclick: () =>
        openCook({ title: o.title, servings: o.servings, uses: o.uses, people: state.plan.people || state.settings.people, source: { d, m, o: oi } }) }, "Bunu yapıyorum")));
}

function viewGecmis() {
  if (!state.history.length) return [h("div", { class: "card empty" },
    h("h2", null, "Henüz yemek kaydı yok"),
    h("p", { class: "muted" }, "Menüde bir tarifte \"Bunu yapıyorum\" dediğinde burada görünür. Yanlışlıkla düştüğün malzemeleri buradan geri alabilirsin."))];
  const fmt = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  return [h("h2", null, "Yaptıkların"), h("div", { class: "card" }, state.history.map(e => h("div", { class: "stack", style: "padding-block:8px;border-top:1px solid var(--line)" },
    h("div", { class: "row between" }, h("h3", null, e.title), h("span", { class: "small muted" }, fmt.format(e.at))),
    h("div", { class: "uses" }, `${e.people} kişilik · ` + (e.cost ? `≈ ${fmtTL(e.cost)} · ` : ""), e.used.length ? e.used.map((u, i) => [i ? ", " : "", h("b", null, u.name), " " + fmtQty(u.qty, u.unit)]) : "dolaptan bir şey düşülmedi"),
    h("div", null, h("button", { class: "ghost", type: "button", onclick: () => undoHistory(e.id) }, "Geri al")))))];
}

function go(tab) { ui.tab = tab; ui.err = null; render(); window.scrollTo(0, 0); }
let btn = null;
function render() {
  const v = document.getElementById("view");
  const views = { dolap: viewDolap, ekle: viewEkle, menu: viewMenu, gecmis: viewGecmis };
  const notices = [];
  if (ui.lastError) notices.push(h("div", { class: "notice err stack" },
    h("strong", null, "Bir hata oluştu."),
    h("span", { class: "small mono" }, ui.lastError),
    h("div", null, h("button", { type: "button", onclick: () => { ui.lastError = null; render(); } }, "Kapat"))));
  if (ui.saveErr) notices.push(h("div", { class: "notice err stack" },
    h("strong", null, "Son değişiklikler hesabına kaydedilemedi."),
    h("span", null, "Sayfayı kapatmadan önce tekrar dene. Sorun sürerse aşağıdaki hata metnini Claude'a ilet."),
    h("span", { class: "small mono" }, ui.saveErr),
    h("div", null, h("button", { type: "button", onclick: flush }, "Tekrar dene"))));
  else if (ui.dbChecked && !docRef) notices.push(h("div", { class: "notice" },
    "Hesabına bağlanılamadı; değişiklikler yalnızca bu tarayıcıda tutuluyor ve kaybolabilir. Sayfayı claude.ai'de oturum açıkken aç."));
  v.replaceChildren(...notices, ...views[ui.tab]());
  document.querySelectorAll("nav.tabs button").forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

/* ---------- başlangıç ---------- */
(function start() {
  window.addEventListener("error", e => report("sayfa", e.error || e.message));
  window.addEventListener("unhandledrejection", e => report("sayfa", e.reason));
  const local = loadLocal();
  if (local) state = merged(local);
  setSync("Bu cihazda");
  render();
  const use = window.claude && window.claude.use;
  if (!use) { ui.dbChecked = true; setSync("Bu cihazda (Claude dışında)"); render(); return; }
  window.claude.use("sample").then(async s => {
    sample = s;
    if (s) { try { const l = await s.limits(); imageLimits = l && l.images ? l.images : null; } catch (e) { imageLimits = null; } }
    render();
  });
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(async ([d, u]) => {
    const id = u ? await u.id() : null;
    if (!d || !id) { ui.dbChecked = true; setSync("Yalnızca bu cihazda"); render(); return; }
    db = d;
    const ref = db.doc("data/users/" + id + "/kitchen");
    try {
      const snap = await ref.get();
      docRef = ref;
      debugBase = "data/users/" + id + "/";
      // Kayıttan gelen veri salt okunurdur (dondurulmuş); değiştirebilmek için derin kopya al.
      const remote = snap.exists ? merged(JSON.parse(JSON.stringify(snap.data()))) : null;
      // Hangisi daha yeniyse o kalır: eski hesap kaydı yeni yerel değişiklikleri ezmesin.
      if (remote && (remote.updatedAt || 0) >= (state.updatedAt || 0)) {
        state = remote;
        try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
        setSync("Hesabına kaydediliyor");
      } else if (state.items.length || state.history.length || state.plan) {
        save();
      }
      ui.dbChecked = true;
      render();
    } catch (e) {
      ui.dbChecked = true;
      setSaveError("hesaptan okunamadı: " + ((e && e.code) || "bilinmiyor"));
      setSync("Yalnızca bu cihazda");
    }
  });
})();
</script>
