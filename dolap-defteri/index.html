<style>
/* Layout: tek sütunlu mobil uygulama; üstte başlık, altta sabit sekme çubuğu, ortada kartlar. */
:root {
  --bg: #EEF2EA;
  --surface: #FFFFFF;
  --ink: #1C271D;
  --muted: #5B6858;
  --line: #D8DFD2;
  --accent: #2E6A3E;
  --accent-ink: #FFFFFF;
  --accent-soft: #DDEBDA;
  --warn: #8A5A0C;
  --warn-soft: #F5E7C8;
  --danger: #A83428;
  --danger-soft: #F5DCD7;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111611; --surface: #1A211A; --ink: #E4EBE0; --muted: #98A595; --line: #2B352A;
    --accent: #84C48F; --accent-ink: #0E1A10; --accent-soft: #1F3223;
    --warn: #E6BA62; --warn-soft: #362C15; --danger: #F0907F; --danger-soft: #3A1E1A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111611; --surface: #1A211A; --ink: #E4EBE0; --muted: #98A595; --line: #2B352A;
  --accent: #84C48F; --accent-ink: #0E1A10; --accent-soft: #1F3223;
  --warn: #E6BA62; --warn-soft: #362C15; --danger: #F0907F; --danger-soft: #3A1E1A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
header.top { padding-block: 20px 4px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: 28px; letter-spacing: -0.02em; margin: 0; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; margin: 0; text-wrap: balance; }
h3 { font-family: var(--f-display); font-weight: 600; font-size: 17px; margin: 0; text-wrap: balance; }
.sync { font-size: 12px; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; }

button, .btn {
  font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); padding: 10px 14px; cursor: pointer; min-height: 42px;
}
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
button.danger { color: var(--danger); }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
button.wide { width: 100%; }

input, select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 10px; min-height: 42px; min-width: 0;
}
textarea { width: 100%; min-height: 96px; resize: vertical; }
input.qty { width: 84px; font-family: var(--f-mono); text-align: right; }
select.unit { width: 84px; }
input.name { flex: 1 1 140px; }

.search { width: 100%; }
.group { display: grid; gap: 0; }
.group h3 { font-size: 14px; color: var(--muted); font-family: var(--f-body); font-weight: 600; padding-block: 12px 4px; }
.item { display: flex; align-items: center; gap: 10px; padding-block: 10px; border-top: 1px solid var(--line); min-width: 0; }
.item:first-of-type { border-top: 0; }
.item .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .q { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item button { min-height: 34px; padding: 4px 10px; font-size: 13px; }
.edit { display: flex; gap: 8px; flex-wrap: wrap; padding-block: 8px 12px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--ink); white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.done { background: var(--accent); color: var(--accent-ink); }
.toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; user-select: none; }
.toggle input { min-height: 0; margin: 0; accent-color: var(--accent); }
.toggle:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { border: 0; border-radius: 0; min-width: 42px; padding: 8px; }
.stepper output { min-width: 40px; text-align: center; font-family: var(--f-mono); font-size: 17px; }

.day { display: grid; gap: 10px; }
.day > h2 { padding-top: 8px; }
.slot { display: grid; gap: 8px; }
.opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.opt { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; background: var(--surface); align-content: start; min-width: 0; }
.opt.cooked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.faded { opacity: 0.55; }
.uses { font-size: 13px; color: var(--muted); }
.uses b { color: var(--ink); font-weight: 600; }
ol.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }

.notice { border-radius: 12px; padding: 12px 14px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.notice.info { background: var(--accent-soft); color: var(--ink); }
.notice.err { background: var(--danger-soft); color: var(--danger); }

label.file { display: grid; place-items: center; gap: 4px; padding: 20px; border: 1.5px dashed var(--line); border-radius: 12px; cursor: pointer; text-align: center; }
label.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumbs figure { margin: 0; position: relative; }
.thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.thumbs button { position: absolute; top: -8px; right: -8px; min-height: 26px; width: 26px; padding: 0; border-radius: 50%; font-size: 13px; }

.review { display: grid; gap: 8px; }
.review .r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-block: 6px; border-top: 1px solid var(--line); }
.review .r:first-child { border-top: 0; }
.review .r.off { opacity: 0.5; }
.review input[type=checkbox] { min-height: 0; width: 20px; height: 20px; accent-color: var(--accent); }

.empty { text-align: center; padding: 28px 12px; display: grid; gap: 8px; justify-items: center; }
.empty .art { font-family: var(--f-mono); color: var(--muted); font-size: 12px; white-space: pre; line-height: 1.3; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { border: 0; background: transparent; border-radius: 0; display: grid; justify-items: center; gap: 2px; padding: 8px 4px 10px; font-size: 12px; font-weight: 600; color: var(--muted); min-height: 60px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
nav.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.overlay { position: fixed; inset: 0; z-index: 30; background: rgba(10, 16, 10, 0.45); display: grid; align-items: end; justify-items: center; }
.sheet {
  background: var(--surface); color: var(--ink); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto;
  border-radius: 18px 18px 0 0; display: grid; gap: 14px;
  padding-block: 20px calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
}
.drow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.drow .nm { min-width: 0; overflow-wrap: anywhere; }
.drow .left { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 520px); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

<script>
"use strict";
/* ---------- küçük yardımcılar ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const lower = s => String(s || "").trim().toLocaleLowerCase("tr");
const UNITS = ["g", "ml", "adet", "paket", "demet", "kutu", "şişe"];
const CATS = ["Sebze & Meyve", "Et, Tavuk & Balık", "Süt & Kahvaltılık", "Kuru Gıda & Bakliyat", "Baharat, Sos & Yağ", "Donuk", "İçecek", "Diğer"];
const MEALS = ["Kahvaltı", "Öğle", "Akşam"];

// Birimi temel birime çevirir: kg→g, l→ml, tane→adet.
function norm(qty, unit) {
  let q = Number(String(qty).replace(",", ".")) || 0;
  const u = lower(unit).replace(/\.$/, "");
  if (["kg", "kilo", "kilogram"].includes(u)) return { qty: q * 1000, unit: "g" };
  if (["g", "gr", "gram"].includes(u)) return { qty: q, unit: "g" };
  if (["l", "lt", "litre", "liter"].includes(u)) return { qty: q * 1000, unit: "ml" };
  if (["ml", "mililitre"].includes(u)) return { qty: q, unit: "ml" };
  if (["adet", "tane", "ad", "x"].includes(u)) return { qty: q, unit: "adet" };
  if (UNITS.includes(u)) return { qty: q, unit: u };
  return { qty: q, unit: "adet" };
}
function roundQty(q, unit) {
  if (unit === "g" || unit === "ml") return Math.round(q);
  return Math.round(q * 10) / 10;
}
const nf = new Intl.NumberFormat("tr-TR", { maximumFractionDigits: 2 });
function fmtQty(q, unit) {
  if (unit === "g" && q >= 1000) return nf.format(Math.round(q / 10) / 100) + " kg";
  if (unit === "ml" && q >= 1000) return nf.format(Math.round(q / 10) / 100) + " L";
  return nf.format(roundQty(q, unit)) + " " + unit;
}
// Bu miktarın altı "bitti" sayılır.
const nearlyZero = (q, unit) => (unit === "g" || unit === "ml") ? q < 5 : q < 0.25;
const plural = (n, w) => n + " " + w;

/* ---------- durum ---------- */
const LS_KEY = "dolap-defteri-v1";
const blank = () => ({
  items: [], plan: null, history: [], invRev: 0,
  settings: { people: 4, days: 1, meals: ["Kahvaltı", "Öğle", "Akşam"] },
});
let state = blank();
const ui = {
  tab: "dolap", query: "", editing: null,
  text: "", images: [], review: null, busy: null, err: null,
  adhoc: "", openSteps: {},
};
let sample = null, imageLimits = null, db = null, docRef = null, syncLabel = "Bu cihazda";

function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
  return null;
}
function merged(s) {
  const b = blank();
  return { ...b, ...s, settings: { ...b.settings, ...(s && s.settings) } };
}
let saveTimer = null;
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await docRef.set(JSON.parse(JSON.stringify(state))); setSync("Hesabına kaydedildi"); }
    catch (e) { setSync("Kaydedilemedi, bu cihazda tutuluyor"); }
  }, 500);
}
function setSync(t) { syncLabel = t; document.getElementById("sync").textContent = t; }
function commit(inventoryChanged) {
  if (inventoryChanged) state.invRev = (state.invRev || 0) + 1;
  save(); render();
}

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 4200);
}

/* ---------- envanter işlemleri ---------- */
function addItems(list) {
  let added = 0, increased = 0;
  for (const raw of list) {
    const n = norm(raw.qty, raw.unit);
    if (!raw.name || !(n.qty > 0)) continue;
    const ex = state.items.find(i => lower(i.name) === lower(raw.name) && i.unit === n.unit);
    if (ex) { ex.qty = roundQty(ex.qty + n.qty, n.unit); increased++; }
    else {
      state.items.push({ id: uid(), name: String(raw.name).trim(), qty: roundQty(n.qty, n.unit), unit: n.unit,
        category: CATS.includes(raw.category) ? raw.category : "Diğer" });
      added++;
    }
  }
  return { added, increased };
}
function inventoryText() {
  return state.items.map(i => `${i.id} | ${i.name} | ${roundQty(i.qty, i.unit)} ${i.unit}`).join("\n");
}

/* ---------- Claude çağrıları ---------- */
function errText(e) {
  const c = e && e.code;
  if (c === "not_granted") return "Claude'a erişim izni verilmedi. Sayfanın izinler menüsünden açabilirsin.";
  if (c === "rate_limited") return "Claude kullanım sınırına ulaşıldı. Biraz sonra tekrar dene.";
  if (c === "invalid_json") return "Claude'un yanıtı okunamadı. Bir kez daha dene.";
  if (c === "image_rejected") return "Görsel kabul edilmedi. JPG veya PNG, daha küçük bir dosya dene.";
  if (c === "images_unavailable") return "Bu görünümde görsel gönderilemiyor.";
  if (c === "cancelled") return null;
  return (e && e.message) || "Bir şeyler ters gitti. Tekrar dene.";
}
async function runBusy(key, fn) {
  ui.busy = key; ui.err = null; render();
  try { await fn(); }
  catch (e) { ui.err = { key, msg: errText(e) }; }
  finally { ui.busy = null; render(); }
}
const ITEM_RULES = `Her malzeme için: name (Türkçe, sade ürün adı, ilk harf büyük, marka yok; örn. "Spagetti makarna", "Domates"), qty (sayı), unit, category.
unit yalnızca şunlardan biri: g, ml, adet, paket, demet, kutu, şişe. kg ise 1000 ile çarpıp g yaz; litre ise 1000 ile çarpıp ml yaz.
Paket ürünlerde gramaj/hacim biliniyorsa onu kullan (ör. "2 paket 500 g makarna" → 1000 g). Yumurta, limon gibi sayılanlar adet.
category yalnızca şunlardan biri: ${CATS.join(", ")}.`;

async function parseText() {
  const text = ui.text.trim();
  if (!text) return;
  await runBusy("text", async () => {
    const out = await sample.json(
      `Kullanıcı evindeki yiyecek ve mutfak malzemelerini yazdı. Metindeki her malzemeyi çıkar.
${ITEM_RULES}
Yalnızca JSON dizisi döndür, örnek: [{"name":"Spagetti makarna","qty":500,"unit":"g","category":"Kuru Gıda & Bakliyat"}]

Metin:
${text}`, { modelTier: "quick" });
    ui.review = toReview(out, "text");
  });
}
async function parseImages() {
  if (!ui.images.length) return;
  await runBusy("img", async () => {
    const out = await sample.json(
      `Görsel(ler) bir market alışveriş fişi ya da online market siparişinin ekran görüntüsü. Satın alınan ürünleri çıkar.
İndirim, toplam, KDV, poşet, kargo gibi satırları alma. Fişteki kısaltmaları yorumla (ör. "DOMATES KG 1,245" → 1245 g domates; "SUT 1L x2" → 2000 ml süt).
${ITEM_RULES}
Ek alan food: yiyecek/içecek/mutfak malzemesiyse true, temizlik veya kişisel bakım ürünüyse false.
Yalnızca JSON dizisi döndür, örnek: [{"name":"Domates","qty":1245,"unit":"g","category":"Sebze & Meyve","food":true}]`,
      { images: ui.images.map(x => x.file), modelTier: "default" });
    ui.review = toReview(out, "img");
  });
}
function toReview(out, source) {
  const arr = Array.isArray(out) ? out : (out && Array.isArray(out.items) ? out.items : []);
  const rows = arr.filter(x => x && x.name).map(x => {
    const n = norm(x.qty, x.unit);
    return { on: x.food !== false, name: String(x.name), qty: roundQty(n.qty || 1, n.unit), unit: n.unit, category: x.category };
  });
  if (!rows.length) throw { message: "Listede malzeme bulunamadı. Metni ya da görseli kontrol et." };
  return { source, rows };
}
function confirmReview() {
  const rows = ui.review.rows.filter(r => r.on);
  const { added, increased } = addItems(rows);
  if (ui.review.source === "text") ui.text = "";
  else { ui.images.forEach(x => URL.revokeObjectURL(x.url)); ui.images = []; }
  ui.review = null;
  ui.tab = "dolap";
  commit(true);
  toast(`${added} yeni malzeme eklendi` + (increased ? `, ${increased} malzemenin miktarı arttı.` : "."));
}

function dayLabel(i, total) {
  const d = new Date(); d.setDate(d.getDate() + i);
  const s = d.toLocaleDateString("tr-TR", { weekday: "long", day: "numeric", month: "long" });
  if (i === 0) return "Bugün · " + s;
  if (i === 1) return "Yarın · " + s;
  return s.charAt(0).toLocaleUpperCase("tr") + s.slice(1);
}
async function makePlan() {
  const st = state.settings;
  if (!state.items.length) { ui.err = { key: "plan", msg: "Önce dolaba birkaç malzeme ekle." }; render(); return; }
  if (!st.meals.length) { ui.err = { key: "plan", msg: "En az bir öğün seç." }; render(); return; }
  const recent = state.history.slice(0, 10).map(x => x.title).join(", ") || "yok";
  await runBusy("plan", async () => {
    const out = await sample.json(
      `Sen Türk ev mutfağını iyi bilen bir aşçısın. Kullanıcının dolabındaki malzemelerle yemek planı hazırla.

Dolaptaki malzemeler (id | ad | miktar birim):

/* ---------- "Bunu yapıyorum" ---------- */
let cook = null;
function findItem(u) {
  return state.items.find(i => i.id === u.itemId) || state.items.find(i => lower(i.name) === lower(u.name));
}
function usedFor(u, item, people, servings) {
  const n = norm(u.qty, u.unit || item.unit);
  let q = n.qty * people / (servings || people);
  if (n.unit !== item.unit) {
    // farklı birimler (ör. adet / g) güvenle çevrilemez; tarifteki sayıyı aynen öner
    q = Number(u.qty) * people / (servings || people);
  }
  return Math.min(roundQty(q, item.unit), item.qty);
}
function openCook({ title, servings, uses, people, source }) {
  cook = { title, servings, uses, people, source, rows: [] };
  rebuildCookRows();
  renderModal();
}
function rebuildCookRows() {
  const prev = new Map(cook.rows.filter(r => r.edited).map(r => [r.itemId, r]));
  cook.rows = [];
  for (const u of cook.uses) {
    const it = findItem(u);
    if (!it || cook.rows.some(r => r.itemId === it.id)) continue;
    const p = prev.get(it.id);
    cook.rows.push(p || { itemId: it.id, use: usedFor(u, it, cook.people, cook.servings), edited: false });
  }
}
function applyCook() {
  const used = [], finished = [];
  for (const r of cook.rows) {
    const it = state.items.find(i => i.id === r.itemId);
    const q = Math.max(0, Number(String(r.use).replace(",", ".")) || 0);
    if (!it || !q) continue;
    const before = it.qty;
    const take = Math.min(q, it.qty);
    it.qty = roundQty(it.qty - take, it.unit);
    used.push({ itemId: it.id, name: it.name, unit: it.unit, category: it.category, qty: take, before });
    if (nearlyZero(it.qty, it.unit)) finished.push(it.name);
  }
  state.items = state.items.filter(i => !nearlyZero(i.qty, i.unit));
  if (cook.source && state.plan) {
    const s = cook.source, slot = state.plan.days[s.d] && state.plan.days[s.d].meals[s.m];
    if (slot) slot.done = { option: s.o, people: cook.people };
  }
  state.history.unshift({ id: uid(), title: cook.title, people: cook.people, at: Date.now(), used, source: cook.source });
  state.history = state.history.slice(0, 60);
  cook = null; renderModal();
  commit(true);
  toast(finished.length ? `Dolap güncellendi. Biten: ${finished.join(", ")}.` : "Dolap güncellendi. Afiyet olsun!");
}
function undoHistory(id) {
  const ix = state.history.findIndex(x => x.id === id);
  if (ix < 0) return;
  const e = state.history[ix];
  for (const u of e.used) {
    const it = state.items.find(i => i.id === u.itemId);
    if (it) it.qty = roundQty(it.qty + u.qty, it.unit);
    else state.items.push({ id: u.itemId, name: u.name, unit: u.unit, category: u.category || "Diğer", qty: u.before });
  }
  if (e.source && state.plan) {
    const slot = state.plan.days[e.source.d] && state.plan.days[e.source.d].meals[e.source.m];
    if (slot) slot.done = null;
  }
  state.history.splice(ix, 1);
  commit(true);
  toast(`"${e.title}" geri alındı, malzemeler dolaba döndü.`);
}

  const rows = cook.rows.map(r => {

    h("div", { class: "small muted" }, `${st.days} gün × ${st.meals.length} öğün, ${st.people} kişilik`),
    errFor("plan"),
    busyBtn("plan", state.plan ? "Yeni menü öner" : "Menü öner", "Menü hazırlanıyor…", makePlan, { disabled: !sample })));

  const p = state.plan;
  if (p) {
    if (p.invRev !== state.invRev) out.push(h("div", { class: "notice info" }, "Dolap bu menüden sonra değişti. Güncel malzemelere göre yeni menü önerebilirsin."));
    p.days.forEach((day, d) => {
      out.push(h("section", { class: "day" },
        h("h2", null, day.label),
        day.meals.map((slot, m) => h("div", { class: "slot" },
          h("div", { class: "row between" }, h("span", { class: "label" }, slot.meal),
            slot.done ? h("span", { class: "chip done" }, `Yapıldı · ${slot.done.people} kişi`) : null),
          h("div", { class: "opts" }, slot.options.map((o, oi) => optionCard(o, d, m, oi, slot)))))));
    });
  }

  out.push(h("div", { class: "card" },
    h("h3", null, "Menü dışında bir şey mi yaptın?"),
    h("p", { class: "small muted" }, "Ne yaptığını yaz, dolaptan düşmem gerekenleri hesaplayayım."),
    h("input", { id: "adhoc", placeholder: "Ör. 2 kişilik menemen yaptım", value: ui.adhoc, oninput: e => { ui.adhoc = e.target.value; } }),
    errFor("adhoc"),
    busyBtn("adhoc", "Hesapla", "Hesaplıyorum…", adhocCook, { disabled: !sample || !state.items.length })));
  return out;
}
function optionCard(o, d, m, oi, slot) {
  const key = `${d}-${m}-${oi}`;
  const cooked = slot.done && slot.done.option === oi;
  const missingNow = o.uses.filter(u => !findItem(u));
  const usesEl = h("div", { class: "uses" }, "Dolaptan: ",
    o.uses.length ? o.uses.map((u, i) => {
      const it = findItem(u), n = norm(u.qty, u.unit || (it && it.unit));
      return [i ? ", " : "", h("b", null, u.name || (it && it.name)), " " + fmtQty(n.qty, n.unit)];
    }) : "—");
  const open = ui.openSteps[key];
  return h("article", { class: "opt" + (cooked ? " cooked" : slot.done ? " faded" : "") },
    h("div", { class: "row between" }, h("h3", null, o.title), o.minutes ? h("span", { class: "small muted mono" }, o.minutes + " dk") : null),
    o.summary ? h("div", { class: "small" }, o.summary) : null,
    usesEl,
    (o.extra.length || missingNow.length) ? h("div", { class: "chips" },
      o.extra.map(x => h("span", { class: "chip warn" }, "Eksik: " + x.name)),
      missingNow.map(u => h("span", { class: "chip warn" }, "Bitti: " + u.name))) : null,
    open ? (ui.busy === "steps:" + key ? h("div", { class: "small muted" }, h("span", { class: "spin" }), " Tarif yazılıyor…")
      : o.steps ? h("div", { class: "stack" }, h("ol", { class: "steps" }, o.steps.map(s => h("li", null, s))), o.tip ? h("div", { class: "small muted" }, "İpucu: " + o.tip) : null)
      : errFor("steps:" + key)) : null,
    h("div", { class: "row" },
      h("button", { type: "button", disabled: !sample || (!!ui.busy && ui.busy !== "steps:" + key), onclick: () => loadSteps(d, m, oi) }, open ? "Tarifi gizle" : "Tarif"),
      cooked ? null : h("button", { class: "primary", type: "button", onclick: () =>
        openCook({ title: o.title, servings: o.servings, uses: o.uses, people: state.plan.people || state.settings.people, source: { d, m, o: oi } }) }, "Bunu yapıyorum")));
}

function viewGecmis() {
  if (!state.history.length) return [h("div", { class: "card empty" },
    h("h2", null, "Henüz yemek kaydı yok"),
    h("p", { class: "muted" }, "Menüde bir tarifte \"Bunu yapıyorum\" dediğinde burada görünür. Yanlışlıkla düştüğün malzemeleri buradan geri alabilirsin."))];
  const fmt = new Intl.DateTimeFormat("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  return [h("h2", null, "Yaptıkların"), h("div", { class: "card" }, state.history.map(e => h("div", { class: "stack", style: "padding-block:8px;border-top:1px solid var(--line)" },
    h("div", { class: "row between" }, h("h3", null, e.title), h("span", { class: "small muted" }, fmt.format(e.at))),
    h("div", { class: "uses" }, `${e.people} kişilik · `, e.used.length ? e.used.map((u, i) => [i ? ", " : "", h("b", null, u.name), " " + fmtQty(u.qty, u.unit)]) : "dolaptan bir şey düşülmedi"),
    h("div", null, h("button", { class: "ghost", type: "button", onclick: () => undoHistory(e.id) }, "Geri al")))))];
}

function go(tab) { ui.tab = tab; ui.err = null; render(); window.scrollTo(0, 0); }
let btn = null;
function render() {
  const v = document.getElementById("view");
  const views = { dolap: viewDolap, ekle: viewEkle, menu: viewMenu, gecmis: viewGecmis };
  v.replaceChildren(...views[ui.tab]());
  document.querySelectorAll("nav.tabs button").forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));

/* ---------- başlangıç ---------- */
(function start() {
  const local = loadLocal();
  if (local) state = merged(local);
  setSync("Bu cihazda");
  render();
  const use = window.claude && window.claude.use;
  if (!use) { setSync("Bu cihazda (Claude dışında)"); return; }
  window.claude.use("sample").then(async s => {
    sample = s;
    if (s) { try { const l = await s.limits(); imageLimits = l && l.images ? l.images : null; } catch (e) { imageLimits = null; } }
    render();
  });
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(async ([d, u]) => {
    const id = u ? await u.id() : null;
    if (!d || !id) { setSync("Bu cihazda"); return; }
    db = d;
    docRef = db.doc("data/users/" + id + "/kitchen");
    try {
      const snap = await docRef.get();
      if (snap.exists) { state = merged(snap.data()); try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} render(); }
      else if (local) save();
      setSync("Hesabına kaydediliyor");
    } catch (e) { docRef = null; setSync("Bu cihazda"); }
  });
})();
</script>
